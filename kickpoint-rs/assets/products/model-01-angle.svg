<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="m01a-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="m01a-sole" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#F2F2F0" />
      <stop offset="100%" stop-color="#E1E1DE" />
    </linearGradient>
  </defs>

  <!-- Ground drop shadow -->
  <ellipse cx="300" cy="345" rx="220" ry="22" fill="url(#m01a-shadow)" />

  <!-- Sneaker 3/4 Front Angle View -->
  <g id="sneaker-low-bw-angle">
    <!-- Midsole Base -->
    <path d="M140 315 C135 305 145 298 165 295 L445 285 C475 285 490 295 485 310 C480 325 455 332 420 334 L165 334 C148 334 142 325 140 315 Z" fill="url(#m01a-sole)" />
    <!-- Outsole bottom rim -->
    <path d="M145 330 L425 330 C455 330 475 324 478 334 C470 342 445 344 415 344 L165 344 C148 344 145 338 145 330 Z" fill="#181818" />
    <path d="M155 308 L450 298" stroke="#D2D2CF" stroke-width="1.8" stroke-dasharray="4 3" fill="none" />

    <!-- Upper Body -->
    <path d="M155 295 C145 250 165 210 205 195 C230 185 270 190 310 195 L445 240 C470 255 480 275 470 290 L155 295 Z" fill="#F8F8F6" />

    <!-- Toe Box Front Curve -->
    <path d="M375 235 C420 240 460 260 465 282 C468 290 445 292 410 292 L350 290 C345 265 355 245 375 235 Z" fill="#FFFFFF" />
    <!-- Toe Mudguard (Black) -->
    <path d="M365 290 C360 255 385 235 415 230 C450 238 475 260 475 280 C475 290 450 294 410 294 L365 290 Z" fill="#181818" />
    <g fill="#D0D0CE">
      <circle cx="410" cy="255" r="2.2" />
      <circle cx="425" cy="260" r="2.2" />
      <circle cx="440" cy="268" r="2.2" />
      <circle cx="400" cy="265" r="2.2" />
      <circle cx="415" cy="270" r="2.2" />
      <circle cx="430" cy="275" r="2.2" />
    </g>

    <!-- Heel Overlay (Black) -->
    <path d="M152 295 C145 255 160 215 195 200 C210 215 215 250 210 295 L152 295 Z" fill="#181818" />

    <!-- Inner Collar -->
    <path d="M195 200 C205 170 240 160 270 165 C285 168 295 180 295 195 L255 205 C240 195 220 195 205 205 Z" fill="#222222" />

    <!-- Tongue -->
    <path d="M260 165 L310 145 C320 142 328 148 328 158 L320 200 L275 205 Z" fill="#FFFFFF" />
    <rect x="300" y="145" width="20" height="14" rx="2" fill="#111111" transform="rotate(-15 300 145)" />

    <!-- Eyestay & Laces -->
    <path d="M245 200 L320 165 C328 165 335 175 330 185 L295 240 L260 235 Z" fill="#1A1A1A" />
    <g stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round">
      <line x1="280" y1="185" x2="315" y2="175" />
      <line x1="275" y1="200" x2="305" y2="190" />
      <line x1="270" y1="215" x2="295" y2="205" />
      <line x1="265" y1="230" x2="285" y2="220" />
    </g>

    <!-- Swoosh Accent -->
    <path d="M220 250 C265 245 315 250 365 268 C385 275 390 282 375 284 C350 285 305 270 260 265 C235 262 222 260 220 250 Z" fill="#111111" />
  </g>
</svg>
