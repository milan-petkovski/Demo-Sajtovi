<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="rm-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#000000" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rm-sole" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF6" />
      <stop offset="85%" stop-color="#F2EDE4" />
      <stop offset="100%" stop-color="#E4DDD2" />
    </linearGradient>
  </defs>

  <ellipse cx="305" cy="345" rx="230" ry="24" fill="url(#rm-shadow)" />

  <g id="sneaker-high-mocha">
